version: '3.8'

services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: postgres_db
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PSW}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - ./pg_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_USER}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PSW}
    env_file: .env
    ports:
      - "5050:80"
    depends_on:
      - postgres

  age_viewer:
    image:  bitnine/agviewer:latest
    container_name: age_viewer
    environment:
      AGE_ENDPOINT: "postgresql://${POSTGRES_USER}:${POSTGRES_PSW}@postgres:5432/${DB_NAME}"
    ports:
      - "3001:3001"
    depends_on:
      - postgres